<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>muSync</title>
</head>
<body>
  <header>
    <h1>muSync</h1>
    <p class="sub">Local-first music organizer</p>
  </header>

  <main>
    <section class="panel">
      <h2>Add a song</h2>
      <input id="title" placeholder="Song title" />
      <input id="artist" placeholder="Artist" />
      <button id="add">Add</button>
    </section>

    <section class="panel">
      <h2>Library</h2>
      <ul id="list"></ul>
      <p id="empty" class="muted">No songs yet.</p>
    </section>

<section class="panel">
  <h2>Backup</h2>
  <p class="muted" style="margin-top:0">Save your library as a file, or restore from one.</p>
  <div style="display:flex; gap:8px; flex-wrap:wrap">
    <button id="export-db">Download library</button>
    <button id="import-db">Upload library</button>
    <input id="import-file" type="file" accept=".db,.sqlite,application/octet-stream" hidden />
  </div>
  <p id="backup-status" class="muted" style="margin-bottom:0"></p>
</section>    
  </main>

<footer id="player" class="player" hidden>
  <div class="player-info">
    <div id="player-title" class="player-title">—</div>
    <div id="player-artist" class="player-artist muted"></div>
  </div>
  <audio id="audio" controls preload="metadata"></audio>
</footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
